<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Bilik Foto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat:wght@600&family=Figtree:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>body{padding-block:0 96px}</style>
</head>
<body>

<header class="top">
  <div class="logo">BILIK FOTO · ADMIN</div>
  <div class="row" id="who" hidden>
    <span id="whoMail" class="hint"></span>
    <button type="button" class="chip" data-a="logout">Keluar</button>
  </div>
</header>

<main>
  <form class="login" id="login" novalidate hidden>
    <h1>Masuk admin</h1>
    <p>Halaman ini hanya untuk pengelola galeri.</p>
    <label for="email">Email
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <label for="pass">Kata sandi
      <input id="pass" type="password" autocomplete="current-password" required>
    </label>
    <div class="err" id="err" role="alert"></div>
    <button type="submit" class="btn wide" id="loginBtn">Masuk</button>
  </form>

  <section class="panel" id="panel" hidden>
    <div class="gh">
      <h1>Kelola Galeri</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Cari nama atau ucapan" aria-label="Cari nama atau ucapan">
      <select id="ev" aria-label="Filter kegiatan"></select>
    </div>
    <div class="row">
      <button type="button" class="chip" data-a="selall">Pilih semua yang tampil</button>
      <button type="button" class="chip" data-a="selnone">Batal pilih</button>
      <button type="button" class="chip" data-a="reload">Muat ulang</button>
    </div>
    <div id="gbody"></div>
  </section>
</main>

<div class="bulk" id="bulk" hidden>
  <strong id="bulkN"></strong>
  <button type="button" class="chip danger" data-a="delbulk">Hapus terpilih</button>
  <button type="button" class="chip" data-a="selnone">Batal</button>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Foto" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
